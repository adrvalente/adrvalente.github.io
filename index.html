<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>adrianovalente.pt</title>

    <link rel="stylesheet" href="css/index.css">
</head>

<body>

    <div class="background bg1"></div>
    <div class="background bg2"></div>

    <main class="container">

        <img src="https://avatars.githubusercontent.com/u/286309621?v=4" alt="Foto de perfil Adriano Valente" class="profile-img">

        <h1 data-pt="Adriano Valente" data-en="Adriano Valente">Adriano Valente</h1>

        <p data-pt="Website em construção." data-en="Website under construction.">
            Website em construção.
        </p>

        <p data-pt="Novos projetos e conteúdos em breve." data-en="New projects and content coming soon.">
            Novos projetos e conteúdos em breve.
        </p>

        <!--Botões de navegação para as páginas de CV, Projetos e Badges. Removidos temporariamente para destacar o status atual do site.
        <nav class="home-actions">
            <a href="cv.html" class="home-btn">CV</a>
            <a href="projects.html" class="home-btn">Projects</a>
            <a href="badges.html" class="home-btn">Badges</a>
        </nav>
        -->

        <a href="cv.html" class="status-btn" title="Ver CV">
            <span class="dot"></span>
            <span data-pt="Bem-vindo" data-en="Welcome">Bem-vindo</span>
            <span class="arrow">→</span>
        </a>

    </main>

    <script>
        const userLang = navigator.language || navigator.userLanguage;
        const lang = userLang.startsWith("pt") ? "pt" : "en";

        document.querySelectorAll("[data-pt][data-en]").forEach(element => {
            element.textContent = element.dataset[lang];
        });

        document.documentElement.lang = lang === "pt" ? "pt-PT" : "en";
    </script>
</body>

</html>
