<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>adrianovalente.pt</title>

    <link rel="stylesheet" href="css/index.css">
<script>
if (window.top !== window.self) {
    document.addEventListener("DOMContentLoaded", () => {
        document.documentElement.innerHTML = `
            <head>
                <title>Página bloqueada</title>
                <style>
                    body {
                        margin: 0;
                        height: 100vh;
                        display: flex;
                        justify-content: center;
                        align-items: center;
                        font-family: Arial, sans-serif;
                        background: #0f172a;
                        color: #e5e7eb;
                        text-align: center;
                    }
                </style>
            </head>
            <body>
                <main>
                    <h1>🚫 Página bloqueada</h1>
                    <p>Esta página não pode ser apresentada dentro de um iframe.</p>
                </main>
            </body>
        `;
    });
}
</script>
    
</head>

<body>

    <div class="background bg1"></div>
    <div class="background bg2"></div>

    <main class="container">


        <div class="avatar-wrapper">
            <img src="https://avatars.githubusercontent.com/u/286309621?v=4" class="avatar avatar-main" alt="Adriano Valente">
            <img src="imagens/me_blue.png" class="avatar avatar-hover" alt="Adriano Valente">
        </div>
        <h1 data-pt="Adriano Valente" data-en="Adriano Valente">Adriano Valente</h1>

        <p data-pt="Transformando ideias em soluções digitais." data-en="Turning ideas into digital solutions.">
            Transformando ideias em soluções digitais.
        </p>

        <p data-pt="Projetos, experiências e novos desafios em constante evolução." data-en="Projects, experience, and new challenges continuously evolving.">
            Projetos, experiências e novos desafios em constante evolução.
        </p>

        <!--Botões de navegação para as páginas de CV, Projetos e Badges. Removidos temporariamente para destacar o status atual do site.
        <nav class="home-actions">
            <a href="cv.html" class="home-btn">CV</a>
            <a href="projects.html" class="home-btn">Projects</a>
            <a href="badges.html" class="home-btn">Badges</a>
        </nav>
        -->

        <a href="cv.html" class="status-btn" title="Ver CV">
            <span class="dot"></span>
            <span data-pt="Bem-vindo" data-en="Welcome">Bem-vindo</span>
            <span class="arrow">→</span>
        </a>

    </main>


    <script>
        const userLang = navigator.language || navigator.userLanguage;
        const lang = userLang.startsWith("pt") ? "pt" : "en";

        document.querySelectorAll("[data-pt][data-en]").forEach(element => {
            element.textContent = element.dataset[lang];
        });

        document.documentElement.lang = lang === "pt" ? "pt-PT" : "en";
    </script>
    <script src="js/language.js"></script>
</body>

</html>
